<style>
:root{
  /* taken from the BP logo: navy base, teal mid band, red roof */
  --navy:#0A3A84; --navy-2:#082C66; --teal:#0093B5; --teal-bg:#E1F3F8; --red:#B5121B;
  --paper:#F3F5F9; --surface:#FFFFFF; --ink:#13203A; --muted:#5A6781; --line:#D4DAE5; --row:#F8FAFD;
  --acc:#1F7A4A; --acc-bg:#E2F2E9; --rej:#B5121B; --rej-bg:#FBE6E7; --pend:#5A6781; --pend-bg:#ECEFF5;
  --focus:#0093B5; color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#5C8FE6; --navy-2:#0D1B33; --teal:#3EC1DE; --teal-bg:#123642; --red:#F06A70;
    --paper:#0F1522; --surface:#18202F; --ink:#E5EAF3; --muted:#9AA6BD; --line:#2D3850; --row:#1C2536;
    --acc:#5CC48A; --acc-bg:#16332A; --rej:#F06A70; --rej-bg:#3A1B20; --pend:#A3AEC4; --pend-bg:#27324A;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Barlow,"Segoe UI",Arial,sans-serif;font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
a{color:var(--navy)}

/* header with the logo's three-colour band underneath */
.top{background:var(--surface);display:flex;align-items:center;gap:14px;padding:10px 24px;position:sticky;top:0;z-index:10}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(var(--red) 0 33%,var(--teal) 33% 66%,var(--navy) 66%)}
.top img{width:42px;height:42px}
.top .name{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:700;font-size:20px;letter-spacing:.3px;color:var(--navy);line-height:1}
.top .name small{display:block;font-family:Barlow,sans-serif;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.crumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px;margin-left:18px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--navy)}
.crumb b{color:var(--ink);font-weight:600}
.top .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.wrap{padding:28px 28px 64px;max-width:1600px;margin:0 auto}

/* workflow tabs */
.flow{display:flex;gap:0;margin:0 0 18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto}
.flow a{flex:1;display:flex;gap:10px;align-items:center;padding:11px 16px;text-decoration:none;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;font-weight:500}
.flow a:last-child{border-right:0}
.flow a .n{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.flow a:hover{color:var(--navy)}
.flow a.on{color:#fff;background:var(--navy)}
.flow a.on .n{background:#fff;color:var(--navy);border-color:#fff}
.pshell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.pside{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.pinfo{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pinfo b{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:15.5px;color:var(--navy);overflow-wrap:anywhere}.pinfo span{font-size:13.5px}.pinfo small{color:var(--muted)}.pinfo a{margin-top:6px}
.steps{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.steps a{display:flex;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);position:relative}
.steps a:last-child{border-bottom:0}
.steps a .n{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps a .t{flex:1;display:flex;flex-direction:column;font-weight:600;line-height:1.25}.steps a .t small{font-weight:400;font-size:12px;color:var(--muted)}
.steps a em{font-style:normal;font-size:12px;font-weight:700;background:var(--teal-bg);color:var(--navy);border-radius:10px;padding:1px 8px}
.steps a:hover{background:var(--teal-bg)}
.steps a.on{background:var(--navy);color:#fff}.steps a.on .n{background:#fff;border-color:#fff}.steps a.on .t small{color:#c9d6ef}.steps a.on em{background:#fff}
.steps a.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
@media (max-width:980px){.pshell{grid-template-columns:1fr}.pside{position:static}.steps{flex-direction:row;overflow:auto}.steps a{border-bottom:0;border-right:1px solid var(--line);white-space:nowrap}.steps a .t small{display:none}}
.ibtns{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ibtns::before{content:attr(data-t);font-size:12px;color:var(--muted);margin-right:4px}
.acts{white-space:nowrap}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--navy);cursor:pointer;margin-right:4px;vertical-align:middle}
.icon-btn:hover{border-color:var(--navy);background:var(--teal-bg)} .icon-btn.del{color:var(--red)} .icon-btn.del:hover{border-color:var(--red);background:var(--rej-bg)}
.jedit .fld input,.jedit .fld select,.jedit .fld textarea,.jedit .wpick{width:100%} .jedit textarea{min-height:52px}
.dash{display:inline-block;width:100%;text-align:center;color:var(--muted)}.acts .ibtn{vertical-align:middle}
.ibtn{display:inline-flex;flex-direction:column;align-items:center;gap:0;border:1px solid transparent;background:none;border-radius:6px;padding:3px 6px;cursor:pointer;line-height:1}
.ibtn small{font-size:10.5px;color:var(--muted);margin-top:2px}.ibtn:hover{border-color:var(--line);background:var(--teal-bg)}
.jboxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;max-height:180px;overflow:auto}
.jb{display:flex;flex-direction:column;align-items:center;gap:1px}.jb small{font-size:10.5px;color:var(--muted)}.jb input{width:64px;text-align:center;padding:5px 4px}.jb input.err{border-color:var(--red);background:var(--rej-bg)}
.lotpick{border-left:4px solid var(--tag,#F2B33D);background:var(--teal-bg)}
.dtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--navy);margin-bottom:12px}
.dtabs button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-bottom:0;background:var(--surface);padding:7px 12px;border-radius:6px 6px 0 0;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap;color:var(--muted)}
.dtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dtabs button small{font-weight:500;opacity:.8}.dtabs .x2{border:0;background:none;padding:0 2px;font-size:16px;line-height:1;color:inherit;opacity:.7}
.projbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.projbar h1{font-size:22px}
.projbar span{color:var(--muted)}

h1{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:24px;margin:0;font-weight:700;color:var(--ink)}
.sub{margin:2px 0 0;color:var(--muted)}
h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:17px;margin:22px 0 8px;font-weight:700}

const MONTH_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const srcAll = () => false;   // Welder Register uses current QCMS data only (imported Excel history is not used)
function perfRows(g, year){   // flat rows: {m, w, len, def}  +  defect rows {m, w, code, len}
  const jById=new Map(g.joints.map(j=>[j.id,j])), rows=[], defects=[];
  for(const it of g.rt){ if(it.result==="PENDING") continue; const d=it.report_date||it.nde_requests.request_date; if(!d||+d.slice(0,4)!==year) continue;
    const j=jById.get(it.joint_id); if(!j) continue; const ws=weldersOf(j); if(!ws.length) continue; const m=+d.slice(5,7), len=weldLen(j), def=it.result==="REJ"?(+it.defect_length_mm||0):0;
    ws.forEach(w=>rows.push({m,w,len:len/ws.length,def:def/ws.length,rej:def>0?1:0,n:1}));
    if(it.result==="REJ"&&it.defect_code){ const codes=it.defect_code.split(/[,/ ]+/).filter(Boolean); codes.forEach(c=>ws.forEach(w=>defects.push({m,w,code:c.toUpperCase(),len:(+it.defect_length_mm||0)/codes.length/ws.length}))) } }
  if(srcAll()) S.history.filter(h=>h.year===year).forEach(h=>rows.push({m:h.month,w:h.welder_no,len:+h.weld_length_mm,def:+h.defect_length_mm,rej:0,n:0}));
  return {rows,defects};
}
function computePerformance(g, year){ const cell={}; perfRows(g,year).rows.forEach(r=>{ const k=r.w+"|"+r.m; const c=cell[k]||(cell[k]={len:0,def:0,joints:0,rej:0}); c.len+=r.len; c.def+=r.def; c.joints+=r.n; c.rej+=r.rej }); return cell }

/* continuity: last weld by this welder with the qualified process (GTAW, SMAW, GTAW+SMAW …) */
const procParts = v => String(v||"").toUpperCase().split(/[+\/,\s]+/).filter(Boolean);
function lastWeldFor(joints, w, proc){ const need=procParts(proc); let best=null;
  for(const j of joints){ if(!j.weld_date) continue; const inR=wsplit(j.welder_root).includes(w), inC=wsplit(j.welder_cap).includes(w); if(!inR&&!inC) continue;
    let ok; if(need.length===1){ ok=(inR&&procParts(j.process_root).includes(need[0]))||(inC&&procParts(j.process_cap).includes(need[0])) }
    else { const all=new Set([...procParts(j.process_root),...procParts(j.process_cap)]); ok=need.every(p=>all.has(p)) }
    if(ok&&(!best||j.weld_date>best.weld_date)) best=j }
  return best }
const addMonths=(iso,n)=>{ const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10) };
function continuityOf(joints, q){ const lw=lastWeldFor(joints,q.welder_no,q.process), base=[lw&&lw.weld_date,q.qualified_date].filter(Boolean).sort().pop()||null;
  const until=base?addMonths(base,6):null, days=until?Math.floor((new Date(until+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5):null, expired=q.expiry_date&&q.expiry_date<today();
  const status=expired?"Certificate expired":!base?"No record":days<0?"Lapsed — requalification required":days<=30?"Continuous — due soon":"Continuous";
  return {lw,base,until,days,expired,status,ok:!expired&&base&&days>=0} }

function perfView(g){ const y=S.year, M=S.perfMonth||0, W=S.perfWelder||"", {rows,defects}=perfRows(g,y);
  const fr=rows.filter(r=>(!M||r.m===M)&&(!W||r.w===W)), sum=a=>a.reduce((x,r)=>x+r.len,0), sumD=a=>a.reduce((x,r)=>x+r.def,0);
  const byW=S.welders.map(w=>{ const x=rows.filter(r=>r.w===w.welder_no&&(!M||r.m===M)); return {w,len:sum(x),def:sumD(x),jt:x.reduce((a,r)=>a+r.n,0),rj:x.reduce((a,r)=>a+r.rej,0)} });
  const byM=MONTHS.map((n,i)=>{ const x=rows.filter(r=>r.m===i+1&&(!W||r.w===W)); return {n,full:MONTH_FULL[i],len:sum(x),def:sumD(x)} });
  const dt={}; defects.filter(d=>(!M||d.m===M)&&(!W||d.w===W)).forEach(d=>dt[d.code]=(dt[d.code]||0)+d.len);
  const T={len:sum(fr),def:sumD(fr)}; T.rate=T.len?T.def/T.len:0;
  return {y,M,W,byW,byM,dt,T} }
async function welderSummary(){

/* ===================================================================
   STEP 1 — MATERIAL RECEIVING : upload an Excel file → fill FO.QCD.27
   Reads a filled FO.QCD.27 workbook, or any material list that has a
   header row with Description and Q'ty columns (pick slip export, PO list…)
   =================================================================== */
const COLS = {               // header keywords → field
  item:       /^(item|no\.?|line\s*#?|line no\.?)$/i,
  description:/(detail|description|material desc|item desc|descr)/i,
  qty:        /^(q'?ty|qty|quantity|issue\s*qty|qty\s*issued|received\s*qty)/i,
  unit:       /^(unit|uom|u\/m)/i,
  heat_no:    /(heat|mfg)/i,
  cert_no:    /(cert|mtc|mill test)/i,
  remark:     /^(remark|note|notes)/i,
  po:         /^(po|po no\.?|po number)$/i,
  jde:        /(jde|item\s*#|item no\.?|material no\.?|part no\.?)/i
};
const LABELS = {             // header-field labels found to the left of their value
  job_name:   /^(job no\.?\s*\/\s*name|project\s*name|project\s*\/?\s*pwo|project)\s*:?$/i,
  client_job: /^(client job|fabjob|fab job)\s*(no\.?)?\s*:?$/i,
  bpe_job_no: /^(bpe job no\.?|bp job no\.?|job no\.?)\s*:?$/i,
  report_no:  /^report no\.?\s*:?$/i,
  scope_lot:  /^(scope\s*\/\s*lot|fe issue number|wh issue number)\s*:?$/i,
  receive_date:/^(rec[e]?ive date|receive date|received date|date)\s*:?$/i
};
const cellText = v => v==null ? "" : (v instanceof Date ? v.toISOString().slice(0,10) : String(v).replace(/\s+/g," ").trim());
function toIsoDate(v){
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(typeof v==="number" && v>20000 && v<80000){ const d=XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m,2)}-${pad(d.d,2)}` }
  const t=cellText(v); if(/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0,10);
  const m=t.match(/^(\d{1,2})[\/\-. ]([A-Za-z]{3,}|\d{1,2})[\/\-. ](\d{2,4})$/);
  if(m){ const mon=isNaN(m[2])?MONTHS.findIndex(x=>m[2].toLowerCase().startsWith(x.toLowerCase()))+1:+m[2]; const y=m[3].length===2?2000+ +m[3]:+m[3]; if(mon>0) return `${y}-${pad(mon,2)}-${pad(+m[1],2)}` }
  return null;
}
function readMaterialWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const head={}, items=[], sheetsUsed=[];
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:true});
    // header fields: label cell, value = next non-empty cell on the same row
    rows.forEach(r=>r.forEach((c,ci)=>{ const t=cellText(c); if(!t) return;
      for(const [k,re] of Object.entries(LABELS)){ if(head[k]||!re.test(t)) continue;
        let v=null; for(let x=ci+1;x<r.length;x++){ const tx=cellText(r[x]); if(tx && !Object.values(LABELS).some(rr=>rr.test(tx))){ v=r[x]; break } }
        if(v==null) continue;
        if(k==="receive_date"){ const d=toIsoDate(v); if(d) head[k]=d } else if(k==="bpe_job_no"){ if(/^BP[RE]?-/i.test(cellText(v))) head[k]=cellText(v) } else head[k]=cellText(v);
      } }));
    // item table: first row with a description column and a quantity column
    let hr=-1, map={};
    for(let i=0;i<Math.min(rows.length,60)&&hr<0;i++){
      const m={}; (rows[i]||[]).forEach((c,ci)=>{ const t=cellText(c); if(!t||t.length>40) return; for(const [k,re] of Object.entries(COLS)) if(m[k]==null && re.test(t)){ m[k]=ci; break } });
      if(m.description!=null && m.qty!=null){ hr=i; map=m }
    }
    if(hr<0) continue;
    sheetsUsed.push(name);
    for(let i=hr+1;i<rows.length;i++){
      const r=rows[i]||[], g=k=>map[k]==null?"":cellText(r[map[k]]);
      const first=cellText(r.find(c=>cellText(c))||"");
      if(/^(inspection by|prepared by|reviewed by|total|note\s*:)/i.test(first)) break;
      const desc=g("description"); if(!desc) continue;
      const qraw=map.qty==null?null:r[map.qty]; const qty=qraw==null||qraw===""?null:(isNaN(+qraw)?parseFloat(String(qraw).replace(/[^\d.]/g,""))||null:+qraw);
      const rem=[g("remark"), g("po")?`PO ${g("po")}`:"", g("jde")&&map.jde!==map.item?`JDE ${g("jde")}`:""].filter(Boolean).join(" / ");
      items.push({description:desc,qty,unit:g("unit"),heat_no:g("heat_no"),cert_no:g("cert_no"),remark:rem});
    }
  }
  return {head,items,sheetsUsed};
}

/* ===================================================================

   =================================================================== */
const normName = s => String(s||"").toUpperCase().replace(/\s+/g," ").replace(/\s*([,:\/x×])\s*/gi,"$1").trim();
async function loadMatSummary(){
  const rows = await fetchAll(()=>sb.from("materials").select("id,report_id,report_no,receive_date,item_no,description,qty,unit,heat_no,cert_no,remark").eq("project_id",S.pid).order("receive_date").order("report_no").order("item_no"));
  const groups=new Map();
  for(const r of rows){ const unit=(r.unit||"").toUpperCase().trim(); const key=normName(r.description)+"|"+unit;
    const g=groups.get(key)||{name:r.description||"",unit,qty:0,lines:0,heats:new Set(),reports:new Set(),noQty:0};
    if(r.qty==null) g.noQty++; else g.qty+=+r.qty; g.lines++; if(r.heat_no) g.heats.add(r.heat_no); if(r.report_no) g.reports.add(r.report_no); groups.set(key,g) }
  const totals=[...groups.values()].sort((a,b)=>b.qty-a.qty||a.name.localeCompare(b.name));
  const byUnit={}; rows.forEach(r=>{ if(r.qty!=null){ const u=(r.unit||"–").toUpperCase(); byUnit[u]=(byUnit[u]||0)+ +r.qty } });
  return {rows,totals,byUnit,reports:new Set(rows.map(r=>r.report_id)).size};
}

async function onUpload(file){
  if(!file) return;
  if(!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)) return toast("Upload an Excel file (.xlsx, .xls or .csv)",true);
  if(file.size>20*1024*1024) return toast("The file is larger than 20 MB",true);
  let res; try{ res=readMaterialWorkbook(await file.arrayBuffer()) }catch(e){ return toast("Could not read this Excel file: "+(e.message||e),true) }
  const p=project(), h=res.head;
  if(!res.items.length) toast("No item table found. Check that the sheet has a header row with Description and Q'ty, or fill the items in below.",true);
  await newDraft({ fileName:file.name, job_name:h.job_name||p.name||"", client_job:p.client_job_no||h.client_job||"", bpe_job_no:h.bpe_job_no||p.job_no, scope_lot:h.scope_lot||"-",
    receive_date:h.receive_date||today(), items:res.items.map(x=>Object.assign(x,{photos:[]})) });
  if(h.report_no && !S._reps.some(r=>r.report_no===h.report_no)){ S.draft.report_no=h.report_no; render() }
  if(res.items.length) scheduleSave(0);
  if(h.bpe_job_no && h.bpe_job_no.replace(/\s/g,"").toUpperCase()!==p.job_no.toUpperCase()) toast(`The file shows ${h.bpe_job_no}, but this project is ${p.job_no}. Check before saving.`,true);
  else if(res.items.length) toast(`Read ${res.items.length} item${res.items.length>1?"s":""} from ${res.sheetsUsed.join(", ")}. Check the values, then save.`);
}
async function downloadBlank(){
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(b64ToBuf(FO_QCD_27_TEMPLATE));
  const p1=wb.getWorksheet("Page 1 of 2"), p2=wb.getWorksheet("Page 2 of 2");
  ["C2","K2","C3","K3","K4","B23","E23"].forEach(c=>p1.getCell(c).value=null); p1.getCell("C4").value="-";
  ["C4","L5","C6","L6","C7","L7"].forEach(c=>p2.getCell(c).value=null);
  const buf=await wb.xlsx.writeBuffer(); download(new Blob([buf]),"FO.QCD.27_blank.xlsx");
}

/* ---------- images: resize in the browser before upload ---------- */
function resizeImage(file, max, type){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const g=c.getContext("2d"); if(type==="image/jpeg"){ g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height) } g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    res({dataUrl:c.toDataURL(type,0.85), w:c.width, h:c.height}) };
  img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error(file.name+" is not an image this browser can open"))}; img.src=url }) }
function imgSize(dataUrl){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.width,h:i.height}); i.onerror=()=>res({w:4,h:3}); i.src=dataUrl }) }
const blobToDataUrl = b => new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b) });
async function loadPhotoData(rows){ return Promise.all(rows.map(async p=>{ const {data,error}=await sb.storage.from("material-docs").download(p.path); return {path:p.path,item_no:p.item_no,sort:p.sort,dataUrl:error?null:await blobToDataUrl(data)} })) }

async function persistDraft(d){
  if(!d) return; const items=d.items.filter(x=>x.description);
  if(!d.report_no) return (d._err=true, setMatState("Enter a report no. to save","err"));
  if(!d.id && !items.length) return (d._err=false, setMatState("Saves once an item has a description"));
  if(items.some(x=>x.qty!=null&&isNaN(x.qty))) return (d._err=true, setMatState("Q'ty must be a number — not saved","err"));
  localStorage.setItem("qcms_sign",JSON.stringify({inspector:d.inspector,reviewer:d.reviewer}));
  const head={project_id:S.pid,report_no:d.report_no,job_name:d.job_name,client_job:project().client_job_no||d.client_job,bpe_job_no:d.bpe_job_no,scope_lot:d.scope_lot,receive_date:d.receive_date||null,inspector:d.inspector,reviewer:d.reviewer,ca_agency:d.ca_agency,place:d.place,description:d.description,findings:d.findings};
  try{
    if(d.id) await q(sb.from("material_reports").update(head).eq("id",d.id));
    else d.id=(await q(sb.from("material_reports").insert(head).select()))[0].id;
    const rid=d.id;
    const photoRows=[];
    for(const [i,x] of items.entries()) for(const [k,ph] of x.photos.entries()){
      if(!ph.path){ const path=`photos/${S.pid}/${rid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const blob=await (await fetch(ph.dataUrl)).blob(); const up=await sb.storage.from("material-docs").upload(path,blob,{contentType:"image/jpeg"}); if(up.error) throw up.error; ph.path=path }
      photoRows.push({report_id:rid,item_no:i+1,sort:k,path:ph.path}) }
    await q(sb.from("materials").delete().eq("report_id",rid)); await q(sb.from("material_photos").delete().eq("report_id",rid));
    if(items.length) await q(sb.from("materials").insert(items.map((x,i)=>({project_id:S.pid,report_id:rid,report_no:d.report_no,receive_date:d.receive_date||null,item_no:i+1,description:x.description,qty:x.qty,unit:x.unit||null,heat_no:x.heat_no||null,cert_no:x.cert_no||null,remark:x.remark||null,inspected_by:d.inspector||null}))));
    if(photoRows.length) await q(sb.from("material_photos").insert(photoRows));
    if(d.removed.length){ const rm=d.removed.splice(0); await sb.storage.from("material-docs").remove(rm) }
    d._err=false; setMatState("All changes saved","ok");
  }catch(e){ d._err=true; setMatState(e.code==="23505"?`Report no. ${d.report_no} already exists — change it`:"Not saved: "+(e.message||e),"err") }
}

/* ---------- Export: fill the original FO.QCD.27 workbook ---------- */
const PHOTOS_PER_PAGE = 6, PHOTO_ROWS = 21, BAND_ROWS = 24;   // 21 rows (336 px) for a 295 px photo leaves a clear gap above the caption
const FRAME_W_CM = 10.5, FRAME_H_CM = 8.7;                            // photo frame size on the Inspection report
const FRAME_W_PX = FRAME_W_CM/2.54*96, FRAME_H_PX = FRAME_H_CM/2.54*96;   // exact: Excel shows 7.57 × 7.81 cm
// crop the photo to the frame ratio (centre crop, so long or short photos all end up the same size) and draw the frame line
function framePhoto(dataUrl){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{
  const W=Math.round(FRAME_W_CM*100), H=Math.round(FRAME_H_CM*100), c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const k=Math.max(W/img.width,H/img.height), sw=W/k, sh=H/k; g.fillStyle="#fff"; g.fillRect(0,0,W,H);
  g.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,W,H);
  g.strokeStyle="#1b1b1b"; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6); res(c.toDataURL("image/jpeg",0.88)) };
  img.onerror=()=>res(dataUrl); img.src=dataUrl }) }
const px = w => Math.round(w*7+5);                     // Excel column width (chars) → pixels
function spanPx(ws,c1,c2){ let s=0; for(let c=c1;c<=c2;c++) s+=px(ws.getColumn(c).width||9); return s }
function linesFor(text, chars){ if(!text) return 1; return String(text).split(/\n/).reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/chars)),0) }
const setStyle=(cl,patch)=>{ cl.style=JSON.parse(JSON.stringify(Object.assign({},cl.style,patch))) };  // template cells share style objects
function fitPage(ws){ ws.pageSetup.fitToPage=true; ws.pageSetup.fitToWidth=1; ws.pageSetup.fitToHeight=1 }
function anchorAt(ws, col0, leftPx, row0, topPx){       // exact anchor in EMU (1 px = 9525 EMU)
  let c=col0, x=leftPx; for(;;){ const w=px(ws.getColumn(c+1).width||9); if(x<w) break; x-=w; c++ }
  let r=row0, y=topPx; for(;;){ const h=(ws.getRow(r+1).height||15)*4/3; if(y<h) break; y-=h; r++ }
  return {nativeCol:c, nativeColOff:Math.round(x*9525), nativeRow:r, nativeRowOff:Math.round(y*9525)};
}

/* ---------- PDF: A4 portrait, drawn to the FO.QCD.27 layout, every page fits ---------- */
const PDF_RED=[0,0,0], PDF_INK=[0,0,0];   // all report text is black
function pdfFit(doc, text, x, y, w, h, o={}){            // wrap + shrink text so it always stays inside the box
  text = text==null ? "" : String(text); if(!text) return;
  const pad=o.pad??1.2, maxS=o.size||8, minS=o.min||5, lh=1.18;
  doc.setFont(PDF_FONT, o.bold?"bold":"normal"); doc.setTextColor(...(o.color||PDF_INK));
  const one=o.oneLine||!/\s/.test(text.trim());   // codes (heat no., job no.) shrink instead of breaking mid-word
  let s=maxS, lines;
  for(;;){ doc.setFontSize(s); lines=one?[text]:doc.splitTextToSize(text, w-pad*2);
    const tw=Math.max(...lines.map(l=>doc.getTextWidth(l))), th=lines.length*s*0.3528*lh, ww=Math.max(...text.split(/\s+/).map(t=>doc.getTextWidth(t)));
    if((th<=h-pad && tw<=w-pad*2 && ww<=w-pad*2) || s<=minS) break; s-=0.5 }
  const lineH=s*0.3528*lh, maxLines=Math.max(1,Math.floor((h-pad)/lineH));
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); let l=lines[maxLines-1]; while(l.length>1 && doc.getTextWidth(l+"…")>w-pad*2) l=l.slice(0,-1); lines[maxLines-1]=l+"…" }
  for(let i=0;i<lines.length;i++){ let l=lines[i]; if(doc.getTextWidth(l)>w-pad*2){ while(l.length>1 && doc.getTextWidth(l+"…")>w-pad*2) l=l.slice(0,-1); lines[i]=l+"…" } }
  const total=lines.length*lineH, y0=(o.valign==="top"?y+pad:y+(h-total)/2)+lineH*0.78;
  lines.forEach((l,i)=>{ const tx=o.align==="center"?x+w/2:o.align==="right"?x+w-pad:x+pad; doc.text(l,tx,y0+i*lineH,{align:o.align||"left"}) });
}
function pdfNeed(doc,text,w,h,max,min,pad=0.5,bold=false){ text=text==null?"":String(text); if(!text) return max; doc.setFont(PDF_FONT,bold?"bold":"normal");
  const one=!/\s/.test(text.trim()); for(let s=max;s>min;s-=0.25){ doc.setFontSize(s); const lines=one?[text]:doc.splitTextToSize(text,w-pad*2), tw=Math.max(...lines.map(l=>doc.getTextWidth(l))), ww=Math.max(...text.split(/\s+/).map(t=>doc.getTextWidth(t)));
    if(lines.length*s*0.3528*1.18<=h-pad&&tw<=w-pad*2&&ww<=w-pad*2) return s } return min }
function pdfSameSize(doc,pairs,max,min){ for(let sz=max; sz>min; sz-=0.25){ doc.setFont(PDF_FONT,"normal"); doc.setFontSize(sz); if(pairs.every(([t,w])=>doc.getTextWidth(String(t||""))<=w-2.4)) return sz } return min }
function pdfImgFit(doc, dataUrl, size, x, y, w, h){ const k=Math.min(w/size.w,h/size.h), iw=size.w*k, ih=size.h*k;
  doc.addImage(dataUrl, dataUrl.startsWith("data:image/png")?"PNG":"JPEG", x+(w-iw)/2, y+(h-ih)/2, iw, ih) }

      if(c){ pdfFit(doc,c,X+138,y,22,6,{size:8,bold:true}); pdfFit(doc,d,X+160,y,29,6,{size:8,color:PDF_RED,align:"center"}); doc.line(X+160,y+6,X+189,y+6) } y+=6.5 });
    y+=1; doc.setLineWidth(0.3); doc.line(X,y,X+W,y);

async function exportExcel({r,its,photos}){
  {
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(b64ToBuf(FO_QCD_27_TEMPLATE));
    const p1=wb.getWorksheet("Page 1 of 2"), p2=wb.getWorksheet("Page 2 of 2");

      cp.pageSetup=JSON.parse(JSON.stringify(src.pageSetup)); cp.headerFooter=JSON.parse(JSON.stringify(src.headerFooter||{})); restyle(cp,src); return cp };
    const listChunks=[]; for(let i=0;i<Math.max(its.length,1);i+=ITEMS_PER_PAGE) listChunks.push(its.slice(i,i+ITEMS_PER_PAGE));

    const reps=[p2]; for(let k=1;k<P;k++){ const cp=copySheet(p2,"R"+k); if(logo) cp.addImage(logo.imageId,{tl:logo.range.tl,br:logo.range.br,editAs:"oneCell"}); reps.push(cp) }
    const order=[...wb.worksheets].filter(w=>!lists.includes(w)&&!reps.includes(w)); [...order,...lists,...reps].forEach((w,i)=>w.orderNo=i);

    // ----- list pages -----
    const insp=signerOf(r.inspector), rev=signerOf(r.reviewer);
    const charsAt=(ws,c1,c2,cell)=>Math.max(6,spanPx(ws,c1,c2)/7*11/((ws.getCell(cell).font||{}).size||11)*0.92);
    for(const [k,ws] of lists.entries()){
      ws.name=`Page ${k+1} of ${total}`;
      ws.getCell("C2").value=r.job_name||""; ws.getCell("K2").value=r.report_no||""; ws.getCell("L2").value=`Page ${k+1} of ${total}`;
      ws.getCell("C3").value=project().client_job_no||r.client_job||""; ws.getCell("K3").value=r.bpe_job_no||""; ws.getCell("C4").value=r.scope_lot||"-"; ws.getCell("K4").value=dt;
      ws.getRow(2).height=Math.max(44.25, linesFor(r.job_name,charsAt(ws,3,9,"C2"))*21+6);
      const cD=charsAt(ws,2,6,"B6"), cH=charsAt(ws,9,10,"I6"), cK=charsAt(ws,11,11,"K6"), cL=charsAt(ws,12,12,"L6");
      for(let row=6; row<6+ITEMS_PER_PAGE; row++){ ["A","B","G","H","I","K","L"].forEach(c=>ws.getCell(c+row).value=null) }
      listChunks[k].forEach((it,i)=>{ const row=6+i;
        ws.getCell("A"+row).value=k*ITEMS_PER_PAGE+i+1; ws.getCell("B"+row).value=it.description; ws.getCell("G"+row).value=it.qty==null?null:+it.qty;
        ws.getCell("H"+row).value=it.unit; ws.getCell("I"+row).value=it.heat_no; ws.getCell("K"+row).value=it.cert_no; ws.getCell("L"+row).value=it.remark;
        ["B","I","K","L"].forEach(c=>{ const cl=ws.getCell(c+row); setStyle(cl,{alignment:Object.assign({},cl.alignment,{wrapText:true,vertical:"middle"})}) });
        const lines=Math.max(linesFor(it.description,cD),linesFor(it.heat_no,cH),linesFor(it.cert_no,cK),linesFor(it.remark,cL));
        const base=ws.getRow(row).height||66; ws.getRow(row).height=Math.max(base, lines*20+10);
      });
      fitCells(ws,["K2","K3","K4","C3","C4","L2"],"shrink");
      for(let row=6; row<6+ITEMS_PER_PAGE; row++) fitCells(ws,["A","G","H"].map(c=>c+row),"wrap");
      ws.getCell("B23").value=r.inspector||""; ws.getCell("E23").value=r.reviewer||""; fitCells(ws,["B23","E23"],"shrink");
      if(r.ca_agency && r.ca_agency!=="N/A") ws.getCell("H23").value=`Name : ${r.ca_agency}`;
      ws.getCell("B25").value={formula:"K4",result:dt}; ws.getCell("E25").value={formula:"K4",result:dt};
      const rowH=(ws.getRow(24).height||42.75)*4/3;
      const sigH=((ws.getRow(23).height||30)+(ws.getRow(24).height||42.75))*4/3;   // spans Name + Signature rows, drawn over the name
      for(const [s,c1,c2] of [[insp,2,3],[rev,5,7]]) if(s&&s.signature){ const sz=await imgSize(s.signature); placeImage(wb,ws,s.signature,sz,c1,c2,22,sigH,1) }

    // ----- inspection report pages: 6 photos each (3 rows × 2) -----
    const thin={style:"thin"}, med={style:"medium"};

      ws.getCell("C4").value=r.job_name||""; ws.getCell("L5").value=r.report_no||""; ws.getCell("C6").value=project().client_job_no||r.client_job||""; ws.getCell("L6").value=dt;

      ["A32:G33","H32:M33","A54:G55","H54:M55"].forEach(m=>{ try{ ws.unMergeCells(m) }catch(_){} });
      // 3 bands × (21 rows photo + 3 rows caption) = rows 12–83, every row 12 pt (16 px)
      const LAST=12+3*BAND_ROWS-1;
      for(let row=12; row<=LAST; row++){ ws.getRow(row).height=12;
        for(let c=1;c<=13;c++){ const cl=ws.getCell(row,c); cl.value=null; const b={}; if(c===1) b.left=med; if(c===13) b.right=med; if(row===LAST) b.bottom=med; setStyle(cl,{border:b}) } }
      [[1,7],[8,13]].forEach(([c1,c2])=>{ const have=spanPx(ws,c1,c2), need=FRAME_W_PX+14; if(have<need){ const f=need/have; for(let c=c1;c<=c2;c++) ws.getColumn(c).width=(ws.getColumn(c).width||9)*f } });
      photoChunks[k].forEach((p,s)=>{
        const band=Math.floor(s/2), side=s%2, start=12+band*BAND_ROWS, c1=side?8:1, c2=side?13:7, cap=start+PHOTO_ROWS;
        // every photo is the same frame size: 7.57 cm wide × 7.81 cm high, centred in its half of the page

        const id=wb.addImage({base64:p.framed, extension:"jpeg"});
        ws.addImage(id,{tl:anchorAt(ws,c1-1,left,start-1,top), br:anchorAt(ws,c1-1,left+FRAME_W_PX,start-1,top+FRAME_H_PX)});   // two-cell anchor: moves and sizes with the cells, so print never overlaps the caption
        ws.mergeCells(cap,c1,cap+2,c2);
        const it=its[p.item_no-1]||{}; const cl=ws.getCell(cap,c1);
        const maxCh=Math.floor((spanPx(ws,c1,c2)-12)/6.8)*3-2; let cap_t=`Photo ${k*PHOTOS_PER_PAGE+s+1} · Item ${p.item_no}: ${it.description||""}${it.heat_no?" · Heat "+it.heat_no:""}`; if(cap_t.length>maxCh) cap_t=cap_t.slice(0,maxCh-1).trimEnd()+"…";
        cl.value=cap_t; setStyle(cl,{font:{name:"Cambria",size:9},alignment:{horizontal:"center",vertical:"middle",wrapText:true}});
        for(let rr=cap;rr<=cap+2;rr++) for(let c=c1;c<=c2;c++){ const b=Object.assign({},ws.getCell(rr,c).border);
          if(rr===cap) b.top=thin; if(rr===cap+2) b.bottom=rr===LAST?med:thin; if(c===c1) b.left=c===1?med:thin; if(c===c2) b.right=c===13?med:thin; setStyle(ws.getCell(rr,c),{border:b}) }

function donutPng(segs){ return new Promise(res=>{ const tot=segs.reduce((x,y)=>x+y.value,0), R=104, C=2*Math.PI*R; let off=0;

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280"><rect width="280" height="280" fill="#fff"/>${arcs}<text x="140" y="140" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#000">${tot}</text><text x="140" y="172" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">joints</text></svg>`;
  const img=new Image(); img.onload=()=>{ const cv=document.createElement("canvas"); cv.width=560; cv.height=560; const g=cv.getContext("2d"); g.drawImage(img,0,0,560,560); res(cv.toDataURL("image/png")) };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg) }) }

  let r=5;

  for(let i=0;i<13;i++) ws.getRow(r+i).height=15; r+=13;

function dashPdf(p,d,img1,img2){

  const T=(t,x,y,w,h,o={})=>pdfFit(doc,t,x,y,w,h,Object.assign({size:8,color:K},o));

    T(`Generated ${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}`,X+W-50,10,50,6,{size:7.5,align:"right"}); doc.setDrawColor(0); doc.setLineWidth(0.4); doc.line(X,25,X+W,25); return 29 };

  y+=37;
  const legend=(segs,x,yy)=>{ const tot=segs.reduce((a,b)=>a+b.value,0); segs.forEach((s,i)=>{ const c=s.color.match(/\w\w/g).map(h=>parseInt(h,16)); doc.setFillColor(...c); doc.rect(x,yy+i*6+1.5,3.5,3.5,"F"); T(s.label,x+5,yy+i*6,30,6,{size:7.5,oneLine:true}); T(`${s.value} (${tot?Math.round(s.value/tot*100):0}%)`,x+35,yy+i*6,17,6,{size:7.5,align:"right",oneLine:true}) }) };
  T("Fit-up",X,y,90,6,{size:10,bold:true}); T("Joint status",X+96,y,90,6,{size:10,bold:true}); y+=7;
  doc.addImage(img1,"PNG",X,y,38,38); legend(d.fitSeg,X+40,y+12); doc.addImage(img2,"PNG",X+96,y,38,38); legend(d.stSeg,X+96+38,y+3); y+=44;
  const table=(title,cols,rows)=>{ const lh=6;
    if(y+20>BOT){ doc.addPage(); y=head() } T(title,X,y,W,6,{size:10,bold:true}); y+=7;
    const hd=()=>{ let cx=X; doc.setFillColor(217,222,231); doc.rect(X,y,W,7,"F"); cols.forEach(([h,w])=>{ doc.setDrawColor(150); doc.rect(cx,y,w,7); T(h,cx,y,w,7,{size:7,bold:true,align:"center"}); cx+=w }); y+=7 }; hd();
    rows.forEach(v=>{ doc.setFontSize(7.5); const h=Math.max(lh,doc.splitTextToSize(String(v[0]),cols[0][1]-2).length*3.3+2); if(y+h>BOT){ doc.addPage(); y=head(); hd() } let cx=X; v.forEach((t,i)=>{ doc.rect(cx,y,cols[i][1],h); T(t,cx,y,cols[i][1],h,{size:7.5,align:i?"center":"left"}); cx+=cols[i][1] }); y+=h }); y+=6 };
  if(d.byDwg.length) table("By drawing",[["DWG No. / Line No.",66],["Joints",18],["Fit-up done",20],["Fit-up remaining",22],["Welded",18],["Data complete",22],["Fit-up %",20]],d.byDwg.map(x=>[x.dwg,x.n,x.fit,x.n-x.fit,x.weld,x.ok,(x.n?Math.round(x.fit/x.n*100):0)+"%"]));
  if(d.byM.length) table("NDE by method",[["Method",26],["Joints needing",24],["Requests",20],["Joints requested",24],["ACC",20],["REJ",20],["Pending",24],["No Report No.",28]],d.byM.map(x=>[x.m,x.need,x.reqs,x.joints,x.acc,x.rej,x.pend,x.noRpt]));

  doc.save(dashFile(p)+".pdf"); toast("Dashboard exported to PDF");
}

async function createRequest(){

  if(sel.value==="REJ"&&sel.dataset.prevRes!=="REJ"){ const it=S.items.find(i=>i.id===+sel.closest("tr").dataset.id), j=it&&S.joints.find(x=>x.id===it.joint_id);
    if(j&&repLevel(j)>=MAX_REPAIR){ sel.value=sel.dataset.prevRes||"PENDING"; blockDel(`Joint <b>${esc(j.dwg_no)} / ${esc(j.joint_no)}</b> is already the 2nd repair (R2). It cannot be rejected again — the joint is locked.`); return } }
  sel.closest("tr").querySelectorAll(".rj input").forEach(i=>{i.disabled=sel.value!=="REJ"; if(i.disabled) i.value=""});
  if(sel.value==="REJ"&&sel.dataset.prevRes!=="REJ"){ const id=+sel.closest("tr").dataset.id; setTimeout(()=>askProgressive(id),350) } sel.dataset.prevRes=sel.value }
/* A reject adds a repair joint on the same drawing: 1 → 1R1, 1R1 → 1R2. The rejected joint keeps its REJ record. */
const repLevel = j => { let n=0, x=j; while(x&&x.repair_of){ n++; x=S.joints.find(y=>y.id===x.repair_of) } return n };
const repRoot = j => { let x=j; while(x&&x.repair_of){ const p=S.joints.find(y=>y.id===x.repair_of); if(!p) break; x=p } return x };
const MAX_REPAIR = 2;
async function createRepair(itemId){ const it=S.items.find(i=>i.id===itemId), j=S.joints.find(x=>x.id===(it&&it.joint_id)); if(!j||S.joints.some(x=>x.repair_item===itemId)) return;
  const lvl=repLevel(j)+1; if(lvl>MAX_REPAIR) return;
  const root=repRoot(j), no=`${root.joint_no}R${lvl}`;
  if(S.joints.some(x=>x.dwg_no===j.dwg_no&&String(x.joint_no).toUpperCase()===no.toUpperCase())) return toast(`Joint ${no} already exists on ${j.dwg_no}`,true);
  const keep=["project_id","dwg_no","spool_no","joint_type","location","pipe_material","size_inch","od_mm","schedule","thickness_mm","material_grade","weld_length_mm","nde_required","nde_percent","lot_id"];
  const row=Object.fromEntries(keep.map(k=>[k,j[k]??null])); Object.assign(row,{joint_no:no,repair_of:j.id,repair_item:itemId,remark:`R${lvl}`});
  try{ const ins=await q(sb.from("joints").insert(row).select()); await loadProject(); S.gotoRepair={dwg:j.dwg_no,id:ins&&ins[0]?ins[0].id:null,no};
    toast(`${j.joint_no} rejected — repair joint ${no} (R${lvl}) added to ${j.dwg_no}. Start it again in Fit-up & Welding.`) }catch(e){fail(e)} }
function goRepair(){ const g=S.gotoRepair; if(!g) return; S.gotoRepair=null; if($("#dlg").open) closeDlg(); S.dwgFilter=g.dwg; S.openDwgs=[g.dwg]; S.flashJoint=g.id; S.jsum=false; location.hash=`p/${S.pid}/joints` }
/* Progressive sampling for examination (after a reject): pick the welder(s), then at least 2 more joints of that welder */
function askProgressive(itemId){ const it=S.items.find(x=>x.id===itemId), j=S.joints.find(x=>x.id===(it&&it.joint_id)); if(!j) return;
  openDlg("Progressive Sampling for Examination", `<p style="margin-top:0">Joint <b>${esc(j.dwg_no)} / ${esc(j.joint_no)}</b> was rejected in ${esc(it.nde_requests.request_no)}.</p><p>Carry out progressive sampling for examination?</p>`,
   `<button class="btn" onclick="closeDlg();goRepair()">No</button><button class="btn primary" onclick="progressivePick(${itemId})">Yes</button>`) }
function progCandidates(j,welder,m){ const idx=ndeIndex(S.items);
  return S.joints.filter(x=>x.id!==j.id&&x.weld_date&&weldersOf(x).includes(welder)).map(x=>{ const h=idx[x.id+"|"+m]||[], last=h[h.length-1];
    const done=last&&last.result!=="REJ", miss=missingOf(x); return {x,ok:!done&&!miss.length,why:done?(last.result==="PENDING"?"Already requested":"Already examined"):miss.length?"Missing: "+miss.join(", "):""} }) }
function progressivePick(itemId){ const it=S.items.find(x=>x.id===itemId), j=S.joints.find(x=>x.id===it.joint_id), m=it.nde_requests.method, ws=weldersOf(j);
  const groups=ws.map(w=>({w,c:progCandidates(j,w,m)})), usable=groups.filter(g=>g.c.filter(c=>c.ok).length>=2);
  if(!usable.length){ closeDlg(); toast(`${ws.join(", ")||"The welder"} has fewer than 2 other joints available for ${m}. Progressive sampling is not possible — treated as No.`,true); return goRepair() }
  openDlg("Progressive Sampling for Examination", `<p class="note" style="margin-top:0">Rejected: <b>${esc(j.dwg_no)} / ${esc(j.joint_no)}</b> (${esc(it.nde_requests.request_no)}). Tick the welder, then at least 2 joints of that welder. A new ${m} request is created for them.</p>
   ${groups.map(g=>{ const okN=g.c.filter(c=>c.ok).length, can=okN>=2, wn=(S.welders.find(x=>x.welder_no===g.w)||{}).name||"";
     return `<div class="panel" style="margin-bottom:10px;${can?"":"opacity:.6"}"><label class="bar" style="cursor:pointer"><input type="checkbox" class="pw" value="${esc(g.w)}" ${can&&usable.length===1?"checked":""} ${can?"":"disabled"} onchange="this.closest('.panel').querySelectorAll('.pj').forEach((c,i)=>{ if(!c.disabled) c.checked=this.checked&&i<2 })"><b>${esc(g.w)}</b><span class="note">${esc(wn)} · ${okN} joint${okN===1?"":"s"} available${can?"":" — fewer than 2"}</span></label>
      <div class="chips2" style="margin-top:6px">${g.c.map((c,i)=>`<label class="chip ${c.ok?"":"off"}" title="${esc(c.why)}"><input type="checkbox" class="pj" data-w="${esc(g.w)}" value="${c.x.id}" ${c.ok?"":"disabled"} ${c.ok&&can&&usable.length===1&&g.c.filter(z=>z.ok).indexOf(c)<2?"checked":""} style="margin-right:4px">${esc(c.x.dwg_no)} / ${esc(c.x.joint_no)}</label>`).join("")||`<span class="note">No other joints</span>`}</div></div>` }).join("")}`,
   `<button class="btn" onclick="closeDlg();goRepair()">Cancel</button><button class="btn primary" onclick="createProgressive(${itemId})">Create progressive sampling request</button>`) }
async function createProgressive(itemId){ const it=S.items.find(x=>x.id===itemId), j=S.joints.find(x=>x.id===it.joint_id), orig=S.requests.find(x=>x.id===it.request_id), m=orig.method, p=project();
  const wsel=[...document.querySelectorAll(".pw:checked")].map(x=>x.value); if(!wsel.length) return toast("Tick a welder",true);
  for(const w of wsel){ if(document.querySelectorAll(`.pj:checked[data-w="${w}"]`).length<2) return toast(`Tick at least 2 joints for ${w}`,true) }
  const ids=[...new Set([...document.querySelectorAll(".pj:checked")].filter(x=>wsel.includes(x.dataset.w)).map(x=>+x.value))];
  try{ const mx=await q(sb.from("nde_requests").select("seq").eq("project_id",S.pid).eq("method",m).order("seq",{ascending:false}).limit(1));
    const seq=(mx[0]?mx[0].seq:0)+1, no=`${m}-${p.request_prefix}-${pad(seq)}`;
    const r=await q(sb.from("nde_requests").insert({project_id:S.pid,method:m,seq,request_no:no,request_date:today(),stage:orig.stage||"AS WELD",acceptance:orig.acceptance,acceptance_sub:orig.acceptance_sub,client_spec:orig.client_spec,client_spec_no:orig.client_spec_no,requested_by:orig.requested_by,remark:`Progressive sampling — ${j.dwg_no} / ${j.joint_no} rejected in ${orig.request_no} (welder ${wsel.join(", ")})`}).select());
    await q(sb.from("nde_items").insert(ids.map(jid=>({request_id:r[0].id,joint_id:jid,remark:"Progressive"}))));

async function saveNdeRow(tr){

  const g=k=>{const el=tr.querySelector(`[data-k=${k}]`); if(!el) return null; const v=el.value.trim(); return v===""?null:v};

  if(wasRej&&o.result!=="REJ"&&rep&&(lockOf(rep)||rep.weld_date)){ const sel=tr.querySelector("[data-k=result]"); sel.value="REJ"; sel.dataset.prevRes="REJ"; togRej(sel);

    set("A18",`Surface Condition :   ${d.surface||""}`,"shrink"); set("I18",`Acceptance Criteria : ${d.acceptance||""}`,"shrink"); set("A19",`Calibration :  ${d.calibration||""}`,"shrink"); set("I19",`Reference Document : ${d.ref_doc||""}`,"shrink");
    for(let k=0;k<5;k++){ const r0=23+k*4, j=pg.js[k];
      for(let rr=r0;rr<r0+4;rr++) ["E","G","I","K","L","M","N","O"].forEach(c=>ws.getCell(c+rr).value=null);   // ferrite content + result left blank
      const res=j?(d.results||{})[j.id]:""; if(res){ const col=res==="ACC"?"L":"M"; [r0,r0+2].forEach(rr=>{ const c=ws.getCell(col+rr); c.value="P"; setStyle(c,{font:Object.assign({},ws.getCell("L23").font||{},{name:"Wingdings 2",color:{argb:"FF000000"}}),alignment:{horizontal:"center",vertical:"middle"}}) }) }
      ws.getCell("A"+r0).value=j?j.joint_no:null; ws.getCell("C"+r0).value=j?" WELD ":null; ws.getCell("D"+r0).value=j?weldersOf(j).join(", "):null; if(j) fitCells(ws,["D"+r0],"wrap");
      if(!j) for(let rr=r0;rr<r0+4;rr++) ws.getCell("B"+rr).value=null }
    set("L43",`Total of Tested Point =       ${pg.js.length*6}     POINT(s)`);
    set("D52",r.examined_by||""); set("H52",r.reviewed_by||""); set("D54",r.examined_by?DT:null); set("H54",r.reviewed_by?DT:null);
    const rowH=(ws.getRow(51).height||24)*4/3;
    for(const [nm,c1,c2] of [[r.examined_by,4,7],[r.reviewed_by,8,12]]){ const s=signerOf(nm); if(s&&s.signature){ const sz=await imgSize(s.signature); placeImage(wb,ws,s.signature,sz,c1,c2,50,rowH*2,1) } }
    ws.pageSetup.fitToPage=true; ws.pageSetup.fitToWidth=1; ws.pageSetup.fitToHeight=1;
  }
  blackenWorkbook(wb); wb.calcProperties.fullCalcOnLoad=true;
  const buf=await wb.xlsx.writeBuffer(); download(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`Ferrite_${r.report_no.replace(/[^\w\-]+/g,"_")}_${p.job_no.replace(/[^\w\-]+/g,"_")}.xlsx`); toast("Ferrite report exported");
}

/* ===================================================================
   STEP 6 — WELDING LOTS : joints with NDE % below 100
   =================================================================== */
function lotBadge(j,m){ const l=(S.lots||[]).find(x=>x.id===j.lot_id); if(!l) return ""; const r=lotStats(l).rows.find(x=>x.m===m); if(!r) return "";
  return ` <span class="tag ${r.done>=r.req?"ok":"wait"}" title="Lot ${esc(l.lot_no)}: ${r.req} of ${r.n} joints must be examined by ${m}; ${r.done} requested">${esc(l.lot_no)} · ${r.done}/${r.req}</span>` }
function lotStats(l){ const js=S.joints.filter(j=>j.lot_id===l.id), ms=METHODS.filter(m=>js.some(j=>ndeReq(j).includes(m)));
  return {js, rows:ms.map(m=>{ const need=js.filter(j=>ndeReq(j).includes(m)), req=Math.ceil(need.length*l.percent/100), its=S.items.filter(i=>i.nde_requests.method===m&&need.some(j=>j.id===i.joint_id));
    const done=new Set(its.map(i=>i.joint_id)).size; return {m,n:need.length,req,done,acc:its.filter(i=>i.result==="ACC").length,rej:its.filter(i=>i.result==="REJ").length} })} }
VIEWS.lots = async function(){
  const lots=S.lots||[], unassigned=S.joints.filter(j=>(j.nde_percent||100)<100&&!j.lot_id);
  return `<div class="head"><div><h2 style="margin:0">Welding lots</h2><p class="sub">Joints with NDE 20%, 10% or 5% are grouped in lots. Each lot shows how many joints must be examined (rounded up) and how many are requested.</p></div>
    <div class="bar">${icoGroup("Export",[icoBtn("xl","exportLots()","Excel","Welding lots — Excel")])}
    <select id="newLotPct">${[20,10,5].map(p=>`<option value="${p}">${p}%</option>`).join("")}</select><button class="btn primary" onclick="createLot(+$('#newLotPct').value,null).then(()=>render())">New lot</button></div></div>
  ${unassigned.length?`<div class="hint" style="border-left-color:var(--red)">${unassigned.length} joint${unassigned.length>1?"s":""} with NDE below 100% ${unassigned.length>1?"have":"has"} no lot: ${jl(unassigned)}. Set the lot under NDE required in Fit-up & Welding.</div>`:""}
  ${lots.map(l=>{ const st=lotStats(l), ok=st.rows.length&&st.rows.every(x=>x.done>=x.req);
    return `<div class="panel" style="margin-bottom:12px"><div class="bar" style="justify-content:space-between">
      <div class="bar"><b style="font-size:16px">${esc(l.lot_no)}</b><span class="tag plain">${l.percent}%</span>${st.js.length?(ok?`<span class="tag ok">Sampling complete</span>`:`<span class="tag wait">Sampling open</span>`):`<span class="tag wait">No joints</span>`}</div>
      <div class="bar"><input value="${esc(l.description||"")}" placeholder="Description" onchange="patchLot(${l.id},'description',this)" style="width:280px"><button class="btn sm danger" onclick="delLot(${l.id})">Delete</button></div></div>
     ${st.rows.length?`<div class="tbl-wrap" style="max-height:none;margin-top:8px"><table><thead><tr><th>Method</th><th class="num">Joints in lot</th><th class="num">Required (${l.percent}%)</th><th class="num">Requested</th><th class="num">ACC</th><th class="num">REJ</th><th>Status</th></tr></thead><tbody>
      ${st.rows.map(x=>`<tr><td><b>${esc(mLabel(x.m))}</b></td><td class="num">${x.n}</td><td class="num">${x.req}</td><td class="num">${x.done}</td><td class="num">${x.acc}</td><td class="num">${x.rej}</td><td>${x.done>=x.req?`<span class="tag ok">Complete</span>`:`<span class="tag bad">${x.req-x.done} more to request</span>`}</td></tr>`).join("")}</tbody></table></div>`:""}
     <details style="margin-top:8px"><summary class="note" style="cursor:pointer">Joints in ${esc(l.lot_no)} (${st.js.length})</summary><div style="margin-top:6px">${st.js.length?jointChips(st.js):`<span class="note">None yet</span>`}</div></details></div>` }).join("")||`<p class="empty">No welding lots yet. Choose NDE 20%, 10% or 5% when adding joints, or click New lot.</p>`}`;
};
async function patchLot(id,k,el){ const v=el.value.trim()||null; try{ await q(sb.from("welding_lots").update({[k]:v}).eq("id",id)); S.lots.find(l=>l.id===id)[k]=v; flashSaved(el) }catch(e){fail(e)} }
async function delLot(id){ const l=S.lots.find(x=>x.id===id), n=S.joints.filter(j=>j.lot_id===id).length;
  if(n) return blockDel(`Lot <b>${esc(l.lot_no)}</b> still has ${n} joint${n>1?"s":""}. Move them to another lot (or set NDE 100%) in step 2 Fit-up & Welding first.`);
  if(!confirm(`Delete lot ${l.lot_no}?`)) return; try{ await q(sb.from("welding_lots").delete().eq("id",id)); S.lots=S.lots.filter(x=>x.id!==id); render() }catch(e){fail(e)} }
async function exportLots(){ try{ const p=project(), wb=new ExcelJS.Workbook(), ws=wb.addWorksheet("Welding lots",{pageSetup:{paperSize:9,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0}});
  const thin={style:"thin",color:{argb:"FF9AA6BD"}}, B={top:thin,left:thin,bottom:thin,right:thin}, F=o=>Object.assign({name:"Arial",size:9.5,color:{argb:"FF000000"}},o||{});
  ws.columns=[{width:12},{width:8},{width:30},{width:12},{width:10},{width:12},{width:12},{width:8},{width:8},{width:20},{width:60}];
  ws.mergeCells("A1:K1"); ws.getCell("A1").value=`WELDING LOTS — ${p.job_no}  ·  ${p.name||""}`; ws.getCell("A1").font=F({size:13,bold:true}); ws.getRow(1).height=22;
  const hd=["Lot No.","%","Description","Method","Joints","Required","Requested","ACC","REJ","Status","Joints (DWG / Joint)"]; hd.forEach((h,i)=>{ const c=ws.getRow(3).getCell(i+1); c.value=h; c.font=F({bold:true}); c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFD9DEE7"}}; c.border=B; c.alignment={horizontal:"center",vertical:"middle",wrapText:true} });
  let r=4; (S.lots||[]).forEach(l=>{ const st=lotStats(l), rows=st.rows.length?st.rows:[{m:"",n:st.js.length,req:"",done:"",acc:"",rej:""}];
    rows.forEach((x,i)=>{ const v=[l.lot_no,l.percent+"%",l.description||"",mLabel(x.m),x.n,x.req,x.done,x.acc,x.rej,x.m?(x.done>=x.req?"Complete":`${x.req-x.done} more to request`):"",i===0?st.js.map(j=>`${j.dwg_no} / ${j.joint_no}`).join(", "):""];
      const row=ws.getRow(r); v.forEach((t,ci)=>{ const c=row.getCell(ci+1); c.value=t; c.font=F(); c.border=B; c.alignment={vertical:"middle",wrapText:true,horizontal:ci>=4&&ci<=8?"center":"left"} }); row.height=Math.max(16,linesFor(v[10],66)*12+4); r++ }) });
  ws.views=[{state:"frozen",ySplit:3}]; blackenWorkbook(wb);
  const buf=await wb.xlsx.writeBuffer(); download(new Blob([buf]),`Welding_lots_${p.job_no.replace(/[^\w\-]+/g,"_")}_${today()}.xlsx`); toast("Welding lots exported") }catch(e){fail(e)} }

/* ===================================================================
   AUTH + BOOT
   =================================================================== */
function loginView(msg){
  $("#root").innerHTML=`<div class="login"><div class="panel"><div class="lg"><img class="logo" src="${LOGO}" alt="Best Performance Engineering"><div><h1 style="color:var(--navy)">QCMS</h1><div class="note">Quality Control Management System<br>Best Performance Engineering Co., Ltd.</div></div></div>
    <form id="lf" onsubmit="event.preventDefault();login()" class="form" style="grid-template-columns:1fr"><label class="fld">Email<input name="email" type="email" autocomplete="username" required></label><label class="fld">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary">Sign in</button></form>
    ${msg?`<p style="color:var(--red)">${esc(msg)}</p>`:""}<p class="note">Users are created in Supabase › Authentication › Users.<br>If open access (OPTION B) is enabled in the SQL, you can <a href="#" onclick="guest();return false">continue without signing in</a>.</p></div></div>`;
}
async function login(){ const v=formVals("#lf"); const {data,error}=await sb.auth.signInWithPassword({email:v.email,password:v.password}); if(error) return loginView(error.message); S.user=data.user; location.hash="home"; boot() }
async function logout(){ await sb.auth.signOut(); S.user=null; localStorage.removeItem("qcms_guest"); loginView() }
function guest(){ localStorage.setItem("qcms_guest","1"); boot() }
async function boot(){ try{ await loadMasters(); render() }catch(e){ fail(e); loginView("Could not reach the data: "+(e.message||e)) } }
(async()=>{ const {data}=await sb.auth.getSession(); S.user=data.session?data.session.user:null; if(S.user||localStorage.getItem("qcms_guest")) boot(); else loginView() })();
</script>
